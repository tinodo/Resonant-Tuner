name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Resonant.sln --locked-mode
      - name: Test core
        run: dotnet test tests/Resonant.Core.Tests/Resonant.Core.Tests.csproj --configuration Release --no-restore --logger trx --results-directory TestResults/Core
      - name: Test audio controller
        run: dotnet test tests/Resonant.Audio.Tests/Resonant.Audio.Tests.csproj --configuration Release --no-restore --logger trx --results-directory TestResults/Audio
      - name: Package Windows x64 ZIP and unsigned Store MSIX
        run: ./packaging/Build-Release.ps1 -NoRestore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
      - name: Upload unpackaged Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: Resonant-win-x64
          path: artifacts/Resonant-win-x64/
          if-no-files-found: error
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: Resonant-release-packages
          path: artifacts/release-*/
          if-no-files-found: error