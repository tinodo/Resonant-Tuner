name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'MSIX version (major.minor.build.0)'
        required: true
        type: string
      draft:
        description: 'Keep the release unpublished for review'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate release version and source
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $env:RELEASE_VERSION = $env:RELEASE_TAG -creplace '^v', ''
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw 'Use major.minor.build.0.'
          }
          $version = [version]$env:RELEASE_VERSION
          if ($version.Major -gt 65535 -or $version.Minor -gt 65535 -or $version.Build -gt 65535) {
            throw 'MSIX version components must not exceed 65535.'
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Releases must use a commit from main.' }
          "RELEASE_VERSION=$env:RELEASE_VERSION" >> $env:GITHUB_ENV
      - name: Restore locked dependencies
        run: dotnet restore Resonant.sln --locked-mode
      - name: Test core
        run: dotnet test tests/Resonant.Core.Tests/Resonant.Core.Tests.csproj --configuration Release --no-restore --logger trx --results-directory TestResults/Core
      - name: Test audio controller
        run: dotnet test tests/Resonant.Audio.Tests/Resonant.Audio.Tests.csproj --configuration Release --no-restore --logger trx --results-directory TestResults/Audio
      - name: Package Windows x64 ZIP and unsigned Store MSIX
        run: ./packaging/Build-Release.ps1 -Version $env:RELEASE_VERSION -NoRestore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
      - name: Retain release packages
        uses: actions/upload-artifact@v7
        with:
          name: ResonantTuner-release-packages
          path: artifacts/release-${{ env.RELEASE_VERSION }}/
          if-no-files-found: error
      - name: Create release with verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $release = "artifacts/release-$env:RELEASE_VERSION"
          $notes = @'
          Windows 11 x64. Download the portable ZIP and verify SHA256SUMS.txt.

          The unsigned MSIX is intended for Microsoft Partner Center ingestion, not direct sideload installation.
          '@
          gh release create $tag "$release/ResonantTuner-$env:RELEASE_VERSION-win-x64.zip" "$release/ResonantTuner-$env:RELEASE_VERSION-win-x64.msix" "$release/SHA256SUMS.txt" --draft --target $env:GITHUB_SHA --title "Resonant Tuner $env:RELEASE_VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
      - name: Publish release
        if: github.event_name == 'push' || !inputs.draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "v$env:RELEASE_VERSION" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }