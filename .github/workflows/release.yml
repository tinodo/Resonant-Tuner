name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'MSIX version (major.minor.build.0)'
        required: true
        type: string
      draft:
        description: 'Keep the release unpublished for review'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate release version and source
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $env:RELEASE_VERSION = $env:RELEASE_TAG -creplace '^v', ''
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw 'Use major.minor.build.0.'
          }
          $version = [version]$env:RELEASE_VERSION
          if ($version.Major -gt 65535 -or $version.Minor -gt 65535 -or $version.Build -gt 65535) {
            throw 'MSIX version components must not exceed 65535.'
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Releases must use a commit from main.' }
          $tag = "v$env:RELEASE_VERSION"
          $existingTag = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
          if ($existingTag) {
            $tagCommit = git rev-parse "$tag^{commit}"
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the release tag.' }
            $buildCommit = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the build commit.' }
            if ($tagCommit -ne $buildCommit) {
              throw 'The release tag points to a different commit. Use a new version.'
            }
          }
          "RELEASE_VERSION=$env:RELEASE_VERSION" >> $env:GITHUB_ENV
      - name: Restore locked dependencies
        run: dotnet restore Resonant.sln --locked-mode
      - name: Test core
        run: dotnet test tests/Resonant.Core.Tests/Resonant.Core.Tests.csproj --configuration Release --no-restore --logger trx --results-directory TestResults/Core
      - name: Test audio controller
        run: dotnet test tests/Resonant.Audio.Tests/Resonant.Audio.Tests.csproj --configuration Release --no-restore --logger trx --results-directory TestResults/Audio
      - name: Pack and validate Resonant.Core NuGet package
        run: ./packaging/Build-NuGetPackage.ps1 -Version $env:RELEASE_VERSION -NoRestore
      - name: Package Windows x64 ZIP and unsigned Store MSIX
        run: ./packaging/Build-Release.ps1 -Version $env:RELEASE_VERSION -NoRestore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
      - name: Retain release packages
        uses: actions/upload-artifact@v7
        with:
          name: ResonantTuner-release-packages
          path: artifacts/release-${{ env.RELEASE_VERSION }}/
          if-no-files-found: error
      - name: Retain NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: Resonant.Core-nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
      - name: Create release with verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $release = "artifacts/release-$env:RELEASE_VERSION"
          $notes = @'
          Windows 11 x64. Download the portable ZIP and verify SHA256SUMS.txt.

          The unsigned MSIX is intended for Microsoft Partner Center ingestion, not direct sideload installation.
          '@
          gh release create $tag "$release/ResonantTuner-$env:RELEASE_VERSION-win-x64.zip" "$release/ResonantTuner-$env:RELEASE_VERSION-win-x64.msix" "$release/SHA256SUMS.txt" --draft --target $env:GITHUB_SHA --title "Resonant Tuner $env:RELEASE_VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
      - name: Publish release
        if: github.event_name == 'push' || !inputs.draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "v$env:RELEASE_VERSION" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

  publish-package:
    # Separate job: the write token lives where no repository code runs, and a failed push can be re-run on its own.
    needs: release
    if: github.event_name == 'push' || !inputs.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download Resonant.Core package
        uses: actions/download-artifact@v8
        with:
          name: Resonant.Core-nuget-package
          path: package
      - name: Push to GitHub Packages
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath package -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected one package but found $($packages.Count)." }
          dotnet nuget add source "https://nuget.pkg.github.com/$env:OWNER/index.json" --name github --username $env:OWNER --password $env:TOKEN --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) { throw 'Adding the GitHub Packages source failed.' }
          dotnet nuget push $packages[0].FullName --source github --api-key $env:TOKEN --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'Pushing the package failed.' }
          "PACKAGE_FILE=$($packages[0].Name)" >> $env:GITHUB_ENV
      - name: Check package visibility
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          $version = $env:PACKAGE_FILE -replace '^Resonant\.Core\.(.+)\.nupkg$', '$1'
          $package = $null
          $packageName = $null
          foreach ($name in 'Resonant.Core', 'resonant.core') {
            $json = gh api "users/$env:OWNER/packages/nuget/$name" 2>$null
            if ($LASTEXITCODE -eq 0 -and $json) { $package = $json | ConvertFrom-Json; $packageName = $name; break }
          }
          $lines = @('### Resonant.Core on GitHub Packages', '')
          $public = $false
          if ($package) {
            $listed = $false
            for ($attempt = 1; $attempt -le 3 -and -not $listed; $attempt++) {
              $names = @(gh api "users/$env:OWNER/packages/nuget/$packageName/versions" --paginate --jq '.[].name' 2>$null)
              if ($LASTEXITCODE -eq 0 -and $names -contains $version) { $listed = $true }
              elseif ($attempt -lt 3) { Start-Sleep -Seconds 10 }
            }
            $lines += "- Version ${version}: $(if ($listed) { 'listed' } else { 'not listed yet' })"
            $lines += "- Visibility: $($package.visibility)"
            $lines += "- Package: $($package.html_url)"
            $public = $package.visibility -eq 'public'
          }
          else {
            $lines += "- Version $version was pushed."
            $lines += '- The package is not readable as a public package, so it is private: GitHub publishes the first version of a package as private.'
          }
          if (-not $public) {
            $lines += '- To list it on the repository page: open the package, then Package settings, Danger Zone, Change visibility, Public. GitHub has no API for this and it cannot be undone.'
            Write-Host '::notice title=Make Resonant.Core public::GitHub publishes the first version of a package as private and has no API to change that. To list it on the repository page: open the package, then Package settings, Danger Zone, Change visibility, Public. This cannot be undone.'
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0
