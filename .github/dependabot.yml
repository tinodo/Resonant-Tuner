version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mstest:
        patterns:
          - MSTest*
          - Microsoft.Testing.*
          - Microsoft.TestPlatform.*
          - Microsoft.NET.Test.Sdk
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5